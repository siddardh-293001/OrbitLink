[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitlink"
version = "0.1.0"
description = "A modular LEO satellite internet network simulator"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "plotly>=5.22"]
full = ["sgp4>=2.23", "skyfield>=1.48", "networkx>=3.3", "simpy>=4.1", "numpy>=1.26", "pandas>=2.2", "streamlit>=1.35", "plotly>=5.22"]
dev = ["pytest>=8.2"]

[project.scripts]
orbitlink = "orbitlink.cli:main"
orbitlink-experiment = "orbitlink.analytics.experiment_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
